# This file is included from Nginx's http block by the Ubuntu site config.
limit_req_zone $binary_remote_addr zone=gangyantong_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=gangyantong_auth_refresh:10m rate=120r/m;

server {
    listen 80 default_server;
    server_name www.gangyantong.com gangyantong.com 159.75.155.82 _;

    location /.well-known/acme-challenge/ {
        root /var/www/gangyantong;
    }

    location / {
        return 301 https://www.gangyantong.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name www.gangyantong.com;

    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/www.gangyantong.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.gangyantong.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/gangyantong;
    index index.html;

    client_max_body_size 20m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /index.html =404;
    }

    location = /privacy {
        charset utf-8;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        try_files /static/privacy.html =404;
    }

    location = /privacy.html {
        charset utf-8;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        try_files /static/privacy.html =404;
    }

    location = /support {
        charset utf-8;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        try_files /static/support.html =404;
    }

    location = /support.html {
        charset utf-8;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        try_files /static/support.html =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /api/auth/refresh {
        # Refresh is a normal background operation and must not compete with
        # login/code endpoints, especially for users behind shared carrier NAT.
        limit_req zone=gangyantong_auth_refresh burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000/auth/refresh;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ^~ /api/auth/ {
        # Slow credential stuffing and verification-code guessing without
        # affecting the high-frequency question and answer endpoints.
        limit_req zone=gangyantong_auth burst=15 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
